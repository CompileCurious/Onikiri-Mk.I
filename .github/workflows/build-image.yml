name: Build Onikiri Image

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Cross-compile and package microSD image
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write   # needed to create releases and upload assets

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Build date ───────────────────────────────────────────────────────
      - name: Set build date
        id: date
        run: |
          BUILD_DATE="$(date -u '+%Y-%m-%d')"
          BUILD_STAMP="$(date -u '+%Y%m%d-%H%M')"
          echo "BUILD_DATE=${BUILD_DATE}"    >> "$GITHUB_OUTPUT"
          echo "BUILD_STAMP=${BUILD_STAMP}"  >> "$GITHUB_OUTPUT"
          echo "TAG=build-${BUILD_STAMP}"    >> "$GITHUB_OUTPUT"
          echo "IMG_NAME=onikiri-mkI-${BUILD_STAMP}.img" >> "$GITHUB_OUTPUT"

      # ── Apt dependencies ─────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            dwarves \
            zstd \
            squashfs-tools \
            dosfstools \
            e2fsprogs \
            parted \
            u-boot-tools \
            busybox-static \
            python3 \
            python3-dev \
            swig \
            uuid-dev \
            libgnutls28-dev \
            libgnutls-openssl-dev \
            liblzma-dev \
            cpio \
            rsync \
            wget \
            git \
            kmod \
            debootstrap \
            qemu-user-static \
            binfmt-support

      # ── Rootfs package cache ─────────────────────────────────────────────
      # The rootfs_stage directory is owned by root (created via sudo) so
      # actions/cache cannot tar it directly.  Instead we cache a runner-owned
      # .tar.gz that we create with sudo after the build and chown to the
      # runner.  Before the build we extract it back with sudo so the build
      # script sees out/rootfs_stage/etc/debian_version and skips debootstrap.
      - name: Restore rootfs cache
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: out/rootfs_stage.tar.gz
          key: rootfs-bookworm-arm64-v3

      - name: Extract rootfs cache
        if: steps.rootfs-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p out
          sudo tar -xzf out/rootfs_stage.tar.gz -C out/

      # ── ATF source cache ───────────────────────────────────────────────
      - name: Cache ATF source
        uses: actions/cache@v4
        with:
          path: out/trusted-firmware-a
          key: atf-v2.10.0-src
          restore-keys: |
            atf-v2.10.0-src

      # ── U-Boot source cache ──────────────────────────────────────────────
      - name: Cache U-Boot source
        uses: actions/cache@v4
        with:
          path: out/u-boot
          key: uboot-v2024.10-src
          restore-keys: |
            uboot-v2024.10-src

      # ── Kernel source cache ──────────────────────────────────────────────
      - name: Cache Linux kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: out/linux
          key: linux-6.6.30-defconfig-v10
          restore-keys: |
            linux-6.6.30-defconfig-v10

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build Onikiri image
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          ARCH: arm64
        run: |
          chmod +x build/build.sh build/mkimage.sh
          # Pass HOME=/root explicitly so chroot operations don't write into
          # rootfs_stage/home/runner via the inherited sudo -E environment.
          # losetup and debootstrap/chroot/mount all need root.
          sudo -E HOME=/root bash build/build.sh 2>&1 | tee /tmp/full-build.log
          if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
            echo "=== ERRORS / WARNINGS ===" >&2
            grep -iE "error:|warning:|undefined|fatal|DTC|dtc" /tmp/full-build.log | tail -80 >&2
            exit 1
          fi

      # ── Pack rootfs for next cache (only on cache miss = fresh debootstrap) -
      - name: Archive rootfs for cache
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          if [[ -d out/rootfs_stage ]]; then
            sudo tar -czf out/rootfs_stage.tar.gz -C out/ rootfs_stage
            sudo chown "$(id -u):$(id -g)" out/rootfs_stage.tar.gz
          fi

      # ── Rename artifact with build stamp ─────────────────────────────────
      - name: Rename image with build stamp
        run: |
          # build.sh names the file onikiri-mkI-YYYYMMDD.img (date only);
          # rename to include the full YYYYMMDD-HHMM stamp used in the tag.
          SRC="$(ls out/onikiri-mkI-*.img | head -1)"
          DEST="out/${{ steps.date.outputs.IMG_NAME }}"
          if [[ "$SRC" != "$DEST" ]]; then
            mv "$SRC" "$DEST"
          fi
          echo "IMAGE_PATH=${DEST}" >> "$GITHUB_ENV"

      # ── Upload build artifact (always kept for 7 days) ───────────────────
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.date.outputs.IMG_NAME }}
          path: ${{ env.IMAGE_PATH }}
          retention-days: 7
          if-no-files-found: error

      # ── Compress image for release (GitHub release assets capped at 2 GiB) ─
      - name: Compress image for release
        run: |
          # The image file is owned by root (created via sudo mkimage.sh).
          # Re-own it before compressing so xz can write the output file.
          sudo chown "$USER": "${IMAGE_PATH}"
          xz -T0 -9 -k "${IMAGE_PATH}"
          echo "COMPRESSED_IMAGE_PATH=${IMAGE_PATH}.xz" >> "$GITHUB_ENV"

      # ── Create GitHub prerelease ─────────────────────────────────────────
      - name: Create prerelease and upload image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.TAG }}
          name: "Onikiri Mk.I — Build ${{ steps.date.outputs.BUILD_DATE }}"
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            ## Onikiri Mk.I — Automated Build

            **Build date:** ${{ steps.date.outputs.BUILD_DATE }}
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Branch:** `${{ github.ref_name }}`

            ---

            ### Flashing

            Flash `${{ steps.date.outputs.IMG_NAME }}.xz` to a microSD card (≥ 4 GB).
            Decompress first, or use a tool that handles `.xz` directly:

            ```bash
            # Decompress then flash
            xz -d ${{ steps.date.outputs.IMG_NAME }}.xz
            sudo dd if=${{ steps.date.outputs.IMG_NAME }} of=/dev/sdX bs=4M status=progress conv=fsync
            sudo sync

            # or flash in one step (no temp file needed)
            xzcat ${{ steps.date.outputs.IMG_NAME }}.xz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
            sudo sync
            ```

            ### Image layout

            | Partition | Type | Size | Content |
            |---|---|---|---|
            | p1 | FAT32 | 64 MiB | U-Boot SPL, Image, DTB, boot.scr |
            | p2 | SquashFS | 512 MiB | Read-only root filesystem |
            | p3 | ext4 | remainder | OverlayFS upper + engagement data |

            > **This is a pre-release build.** Intended for authorised security testing on hardware you own or have explicit written permission to test.
          files: ${{ env.COMPRESSED_IMAGE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
