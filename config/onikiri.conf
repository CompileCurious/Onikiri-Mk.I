# /etc/onikiri.conf — Onikiri Mk.I system configuration
#
# Read by the supervisor at startup.
# All paths are absolute target-filesystem paths.

[system]
device_name = Onikiri Mk.I
version = 1.0.0

[paths]
supervisor_socket = /run/onikiri/supervisor.sock
pid_file          = /run/onikiri/supervisor.pid

# Userdata paths — live on the persistent ext4 partition (/dev/mmcblk0p3).
# These directories survive a reflash of the system image.
hid_dir           = /userdata/hid
user_module_dir   = /userdata/modules
config_dir        = /userdata/config
captures_dir      = /userdata/captures
log_dir           = /userdata/logs

# System (read-only) module directory — shipped with the system image.
# User modules in user_module_dir are loaded after system modules and
# may override them by using the same module name.
module_dir        = /usr/local/onikiri/modules

[ui]
# Kivy display backend — sdl2 with kmsdrm driver (no X11)
backend      = sdl2
sdl_driver   = kmsdrm
fullscreen   = true
show_cursor  = false
orientation  = landscape

[network]
default_interface = wlan0
wpa_conf_template = /etc/onikiri/wpa_supplicant.conf.template
wpa_conf_runtime  = /run/onikiri/wpa_supplicant.conf

[security]
# Root filesystem is read-only (SquashFS), stateless.
# All persistent user data lives in /userdata (ext4, p3).
# Engagement wipe clears /userdata/captures only — other user files untouched.
engagement_wipe_cmd = wipe_engagement
socket_permissions = 0600

[logging]
level  = INFO
# stderr for console output; file handler writes to /userdata/logs/supervisor.log
output = stderr,file
